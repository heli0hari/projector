name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt SpoutGL pyinstaller

      - name: Smoke test imports
        run: python -c "import glfw, moderngl, imgui_bundle, OpenGL, SpoutGL, numpy, PIL, av; print('imports ok')"

      - name: Build
        run: >
          pyinstaller --noconfirm --windowed --name ProjMap
          --add-data "app/fonts;app/fonts"
          --collect-all imgui_bundle --collect-all SpoutGL --collect-all glfw
          --collect-all glcontext --collect-all OpenGL --collect-all av
          run.py

      - name: Package
        shell: pwsh
        run: |
          Copy-Item -Recurse blender dist/ProjMap/blender
          Copy-Item README.md dist/ProjMap/
          Compress-Archive -Path dist/ProjMap -DestinationPath ProjMap-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ProjMap-windows
          path: ProjMap-windows.zip

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ProjMap (latest build)
          prerelease: true
          make_latest: true
          files: ProjMap-windows.zip
          body: Automatic build from main. Download ProjMap-windows.zip, extract, run ProjMap.exe.
